{% extends "base.html" %}
{% block title %}我的帳號 · {{ S.shop_name }}{% endblock %}
{% block main_class %}medium{% endblock %}
{% block content %}
<h1>我的帳號</h1>
<div class="grid grid-2">
  <div class="card">
    <h2>個人資料</h2>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}"><input type="hidden" name="action" value="profile">
      <div class="field"><label>Email</label><input type="email" value="{{ current_user.email }}" disabled></div>
      <div class="field"><label for="name">姓名</label><input id="name" type="text" name="name" value="{{ current_user.name }}" required></div>
      <div class="field"><label for="phone">手機號碼（馬來西亞）</label>
        <div class="phone-input"><span class="cc">+60</span><input id="phone" type="tel" name="phone" data-my-phone inputmode="tel" placeholder="12-345 6789"
          value="{{ (current_user.phone|phone)[4:] if current_user.phone.startswith('+60') else current_user.phone }}" {{ 'required' if not current_user.is_admin }}></div>
      </div>
      <button class="btn">儲存</button>
    </form>
  </div>
  <div class="card">
    <h2>修改密碼</h2>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}"><input type="hidden" name="action" value="password">
      <div class="field"><label for="old">目前密碼</label><input id="old" type="password" name="old" required autocomplete="current-password"></div>
      <div class="field"><label for="new">新密碼</label><input id="new" type="password" name="new" required minlength="6" autocomplete="new-password"></div>
      <div class="field"><label for="new2">確認新密碼</label><input id="new2" type="password" name="new2" required minlength="6" autocomplete="new-password"></div>
      <button class="btn">更新密碼</button>
    </form>
  </div>
</div>
{% endblock %}
